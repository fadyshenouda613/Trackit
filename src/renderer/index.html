<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:"
    />
    <title>Trackit</title>
    <!-- Stamps data-theme before the first paint. Must stay in the head and
         must stay classic (no type="module", no defer): the CSP above forbids
         inline script, and a deferred one would run too late to stop a flash
         of the wrong theme. See public/theme-boot.js. -->
    <script src="./theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
